<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#140c06" />
    <meta name="description" content="Basiliska — retro isometric MMORPG foundation. Valehaven gate town." />
    <title>Basiliska — Valehaven</title>
    <link rel="icon" href="/Basiliska/favicon.svg" type="image/svg+xml" />
    <script type="module" crossorigin src="/Basiliska/assets/index-D9x8z_la.js"></script>
    <link rel="stylesheet" crossorigin href="/Basiliska/assets/index-BhMgchDX.css">
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>

      <div id="title-screen">
        <div class="title-veil"></div>
        <div class="title-card">
          <p class="title-kicker">2.5D isometric MMORPG</p>
          <h1>Basiliska</h1>
          <p class="title-sub">Valehaven · Gate of the Green Marches</p>
          <label class="name-field">
            Name
            <input id="hero-name-input" maxlength="16" placeholder="Wanderer" autocomplete="off" />
          </label>
          <div class="class-row" role="list">
            <button type="button" class="class-card selected" data-class="vanguard">
              <canvas class="class-portrait" width="80" height="96"></canvas>
              <span class="class-name">Iron Vanguard</span>
              <span class="class-blurb">Plate &amp; oath. Holds the gate.</span>
            </button>
            <button type="button" class="class-card" data-class="sage">
              <canvas class="class-portrait" width="80" height="96"></canvas>
              <span class="class-name">Aether Sage</span>
              <span class="class-blurb">Sigil &amp; flame. Softens packs.</span>
            </button>
            <button type="button" class="class-card" data-class="archer">
              <canvas class="class-portrait" width="80" height="96"></canvas>
              <span class="class-name">Thorn Archer</span>
              <span class="class-blurb">Bow &amp; briar. Clean picks.</span>
            </button>
          </div>
          <div class="title-actions">
            <button type="button" id="btn-enter">Enter Valehaven</button>
            <button type="button" id="btn-resume" hidden>Continue</button>
          </div>
        </div>
      </div>

      <div id="hud" style="display: none">
        <div id="hud-top-right">
          <div id="minimap-wrap">
            <div id="compass-ring" aria-hidden="true"></div>
            <div id="compass-n" title="North" aria-hidden="true"></div>
            <canvas id="minimap" width="160" height="160"></canvas>
            <div id="minimap-label">Valehaven</div>
          </div>
          <div id="cam-orbit">
            <button type="button" id="cam-ccw" title="Orbit left (Q)">⟲</button>
            <button type="button" id="cam-cw" title="Orbit right (E)">⟳</button>
          </div>
        </div>

        <button type="button" id="btn-skills" title="Skills (K)">✦ Skills</button>

        <div id="skills-panel" class="panel" hidden>
          <div class="panel-head">
            <span>Attributes</span>
            <button type="button" class="panel-close" id="skills-close" aria-label="Close">✕</button>
          </div>
          <div id="skills-list"></div>
        </div>

        <div id="hero-plate">
          <div id="hero-id">
            <strong id="hero-name">Wanderer</strong>
            <span id="hero-class">Iron Vanguard</span>
            <span id="level-text">Lv 1</span>
          </div>
          <div class="stat-row">
            <span class="stat-lab hp">HP</span>
            <div class="stat-bar"><div id="hp-fill"></div></div>
            <span id="hp-text">140 / 140</span>
          </div>
          <div class="stat-row">
            <span class="stat-lab mp">MP</span>
            <div class="stat-bar"><div id="mp-fill"></div></div>
            <span id="mp-text">40 / 40</span>
          </div>
          <div class="stat-row">
            <span class="stat-lab sd">SD</span>
            <div class="stat-bar"><div id="sd-fill"></div></div>
            <span id="sd-text">90 / 90</span>
          </div>
          <div class="xp-row">
            <div id="xp-track"><div id="xp-fill"></div></div>
            <span id="gold-text">50</span>
          </div>
        </div>

        <div id="chat">
          <div id="chat-log"></div>
          <div id="chat-tabs">
            <span class="chat-tab active">Gate</span>
            <span class="chat-tab">Party</span>
            <span class="chat-tab">Guild</span>
          </div>
        </div>

        <div id="action-bar" aria-label="Action bar">
          <button class="ab-slot" data-action="attack" title="Strike (1)"><span class="ab-icon">⚔</span><span class="ab-key">1</span></button>
          <button class="ab-slot" data-action="skill" title="Class skill (2)"><span class="ab-icon">✦</span><span class="ab-key">2</span></button>
          <button class="ab-slot" data-action="potion" title="Red elixir (3)"><span class="ab-icon">🧪</span><span class="ab-key">3</span></button>
          <button class="ab-slot" data-action="mana" title="Blue elixir (4)"><span class="ab-icon">💧</span><span class="ab-key">4</span></button>
          <button class="ab-slot" data-action="examine" title="Examine (5)"><span class="ab-icon">👁</span><span class="ab-key">5</span></button>
        </div>

        <button type="button" id="btn-inventory" title="Inventory" aria-label="Inventory" aria-expanded="true">🎒</button>

        <div id="inventory" class="panel">
          <div class="panel-head">
            <span>Pack</span>
            <span class="panel-head-right">
              <span id="inv-count">0/32</span>
              <button type="button" class="panel-close" id="inv-close" aria-label="Close inventory">✕</button>
            </span>
          </div>
          <div id="inv-grid"></div>
        </div>

        <div id="progress-wrap" hidden>
          <div id="progress-label">Working…</div>
          <div id="progress-bar"><div id="progress-fill"></div></div>
        </div>

        <div id="target-info" hidden>
          <span id="target-name"></span>
          <div class="bar thin"><div id="target-hp"></div></div>
        </div>

        <div id="touch-hint">Q / E or right-drag to orbit · Click tiles to walk · Town is safe</div>
      </div>
    </div>
  </body>
</html>
